name: Release APK
# Push a tag such as v1.0.9 (or run manually) to build a signed APK and publish it to GitHub Releases.
# Needs repository secrets: INVESTON_KEYSTORE_BASE64, INVESTON_KEYSTORE_PASSWORD, INVESTON_KEY_ALIAS, INVESTON_KEY_PASSWORD
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.9)'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Check calculation logic
        run: node --test tests/core.test.cjs
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.INVESTON_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "INVESTON_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/investon.jks"
      - name: Build signed release APK
        env:
          INVESTON_KEYSTORE_FILE: ${{ runner.temp }}/investon.jks
          INVESTON_KEYSTORE_PASSWORD: ${{ secrets.INVESTON_KEYSTORE_PASSWORD }}
          INVESTON_KEY_ALIAS: ${{ secrets.INVESTON_KEY_ALIAS }}
          INVESTON_KEY_PASSWORD: ${{ secrets.INVESTON_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          cp app/build/outputs/apk/release/app-release.apk "InvestOn-$VERSION.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "InvestOn-$VERSION.apk"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APK=InvestOn-$VERSION.apk" >> "$GITHUB_ENV"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f RELEASE_NOTES.md ]; then NOTES=RELEASE_NOTES.md; else NOTES=/dev/null; fi
          gh release create "$TAG" "$APK" --title "InvestOn ${TAG#v}" --notes-file "$NOTES" --target "$GITHUB_SHA" \
            || gh release upload "$TAG" "$APK" --clobber
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/investon.jks"
