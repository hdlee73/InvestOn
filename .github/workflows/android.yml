name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Check calculation and UI logic
        run: node --test tests/core.test.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: UI flow verification
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: InvestOn-UI-verification
          path: verification/
      - name: Build and lint
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease lintRelease
          mkdir build-kit
          cp app/build/outputs/apk/release/app-release-unsigned.apk build-kit/InvestOn-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build-kit/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: InvestOn-build-kit
          path: build-kit/
