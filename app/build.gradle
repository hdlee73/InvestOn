plugins { id 'com.android.application' }
android {
    namespace 'com.hdlee.investon'
    compileSdk 35
    defaultConfig {
        applicationId 'com.hdlee.investon'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.0.9'
        testInstrumentationRunner 'com.hdlee.investon.BackupWorkbookTest'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
